apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
spec:
  containers:
  - name: slow-app
    image: busybox
    args:
    - /bin/sh
    - -c
    - sleep 20 && touch /tmp/started && sleep 600
    startupProbe:
      exec:
        command: ["cat", "/tmp/started"]
      periodSeconds: 5
      failureThreshold: 2  # Allows up to 60 seconds (5 * 12) for the app to boot
    livenessProbe:
      exec:
        command: ["cat", "/tmp/started"]
      periodSeconds: 5
